<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#050505" />
  
  <!-- Lock Icon Outline Box -->
  <rect x="250" y="80" width="100" height="100" stroke="#ffffff" stroke-width="4" fill="transparent" />
  
  <!-- Lock Icon Path (Lucide Lock) -->
  <g transform="translate(280, 110) scale(1.666)">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Main Title -->
  <text x="300" y="240" font-family="monospace, Courier New, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="12">PORTFLOW OS</text>
  
  <!-- Subtext -->
